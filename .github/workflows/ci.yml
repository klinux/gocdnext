name: CI

on:
  push:
    branches: [main]
    # Docs-site content and the root README never affect the Go/web
    # build or tests — don't burn a full CI run (or force a manual
    # [skip ci]) on a docs-only push. Deliberately NOT '**.md':
    # CHANGELOG.md MUST still trigger CI, because the release gate
    # (release.yml verify-ci-green) polls the tagged changelog commit's
    # SHA for a green CI run. pull_request stays unfiltered so a docs
    # PR's check still reports (no required-check deadlock).
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:        # allow a manual re-run (e.g. after a flake)

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gocdnext
          POSTGRES_PASSWORD: gocdnext
          POSTGRES_DB: gocdnext
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gocdnext"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: go version
      - name: Test
        env:
          GOCDNEXT_DATABASE_URL: postgres://gocdnext:gocdnext@localhost:5432/gocdnext?sslmode=disable
        run: |
          # -p 1 on the server module: its db-backed packages each boot their
          # OWN Postgres via testcontainers (internal/dbtest), and running
          # package test binaries in parallel spins many containers at once.
          # On the GitHub runner that exhausts memory and a container gets
          # killed mid-run — surfacing as "connection refused" cascades across
          # unrelated store tests (flaky since ~v0.47.0, incl. on main).
          # Serialising the binaries keeps a single container alive at a time.
          # (Follow-up: have dbtest reuse the job's `services: postgres` with a
          # per-package database, then restore parallelism.)
          cd server && go test -p 1 ./...
          cd ../agent && go test ./...
          cd ../cli && go test ./...
      - name: Schema up to date
        # The pipeline JSON Schema is generated from the parser structs; fail if
        # someone changed schema.go without regenerating + committing schema/.
        run: make schema-check
      - name: Build
        run: make build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      # pnpm action-setup reads packageManager from web/package.json
      # (defaults.working-directory only applies to run: steps, not
      # uses:, so we point at the file explicitly).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  # Renders the Helm chart and asserts the env vars it is supposed to
  # produce. `go` and `web` never touch charts/, so without this a
  # template regression ships silently — the chart is only rendered at
  # release time, long after review.
  #
  # The concrete trigger: a knob whose documented "disable" value is 0.
  # Go templates treat NUMERIC 0 as false, so the natural
  # `{{- if .Values.x }}` drops the env var entirely, and a server that
  # falls back to a default when the var is unset then does the OPPOSITE
  # of what the operator asked. That class of bug is invisible in review
  # and invisible in `helm lint`; only a render catches it.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pinned version the release workflow packages with, so CI
      # can't pass on a helm that differs from the one that ships.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint charts/gocdnext --set database.url=postgres://x

      # database.url is required for the chart to render at all; every
      # case below carries it so a failure is never that precondition.
      - name: Render matrix
        run: |
          set -euo pipefail
          render() {
            helm template charts/gocdnext --set database.url=postgres://x "$@"
          }
          # Value of an env var in the rendered output, or empty when the
          # var is absent. Matches the `- name: X` / `value: Y` pair.
          value_of() {
            grep -A1 -- "- name: $1\$" | sed -n 's/^ *value: //p' | head -1
          }

          fail=0
          expect() { # <label> <want> <got>
            if [ "$2" = "$3" ]; then
              echo "ok   $1: $3"
            else
              echo "FAIL $1: want [$2] got [$3]"; fail=1
            fi
          }

          var=GOCDNEXT_APPROVAL_DEFAULT_TIMEOUT

          expect "default"      '"168h"'  "$(render | value_of $var)"
          # The regression this job exists for: numeric 0 must survive.
          expect "numeric 0"    '"0"'     "$(render --set approvals.defaultTimeout=0 | value_of $var)"
          expect "never"        '"never"' "$(render --set approvals.defaultTimeout=never | value_of $var)"
          expect "explicit 24h" '"24h"'   "$(render --set approvals.defaultTimeout=24h | value_of $var)"
          # An explicitly null value means "not set" — the var is omitted
          # and the server applies its own default.
          expect "null omits"   ''        "$(render --set approvals.defaultTimeout=null | value_of $var)"

          exit $fail
