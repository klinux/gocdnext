name: Trivy plugins gate

# Standing vulnerability gate for the PUBLISHED plugin images (the `:v1` channel)
# plus the external images the buildx plugin pins (binfmt + buildkit). Runs on a
# schedule (not per-PR) and on demand. Policy + baseline:
#   plugins/SECURITY-SCANNING.md, plugins/.trivy-baseline.yaml
# Comparator: plugins/scripts/trivy_gate.py.
#
# Fail-closed by design: the `expect` set comes from the VERSIONED inventory
# (every plugin dir minus `unpublished:` in the baseline), NOT from what the
# registry resolves — so a GHCR outage/auth error can't shrink the scanned set
# to a green run. A scan that can't resolve/pull its image fails the job, which
# the gate then sees as a missing expected target (hard fail).
#
# Rollout: CRITICAL, expired/over-window exceptions, invalid baseline and missing
# scans FAIL from day one. HIGH runs in `observe` during calibration; a later
# one-line PR flips HIGH_MODE to `enforce`.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      high_mode:
        description: "HIGH handling: observe (report) or enforce (fail)"
        type: choice
        options: [observe, enforce]
        default: observe
  pull_request:
    paths:
      - "plugins/scripts/**"
      - "plugins/.trivy-baseline.yaml"
      - "plugins/SECURITY-SCANNING.md"
      - ".github/workflows/trivy-plugins.yml"

permissions:
  contents: read
  packages: read

env:
  HIGH_MODE: observe
  TRIVY_VERSION: "0.69.3"
  # OS + language packages, vuln scanner, HIGH+CRITICAL. No --ignore-unfixed:
  # the standing gate tracks unfixed/upstream-bound HIGH too (baseline windows).
  TRIVY_ARGS: "--quiet --severity HIGH,CRITICAL --scanners vuln --pkg-types os,library --skip-db-update --skip-java-db-update"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - name: comparator unit tests
        run: python3 plugins/scripts/trivy_gate_test.py
      - name: committed baseline parses + validates
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "plugins/scripts")
          import trivy_gate
          n = len(trivy_gate.load_baseline(pathlib.Path("plugins/.trivy-baseline.yaml")))
          print(f"baseline valid: {n} exception(s)")
          PY

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      expect: ${{ steps.set.outputs.expect }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - id: set
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          sys.path.insert(0, "plugins/scripts")
          import yaml

          owner = os.environ["OWNER"].lower()
          reg = f"ghcr.io/{owner}"
          dirs = sorted(p.parent.name for p in pathlib.Path("plugins").glob("*/Dockerfile"))

          base = yaml.safe_load(pathlib.Path("plugins/.trivy-baseline.yaml").read_text()) or {}
          unpublished = {u["target"] for u in (base.get("unpublished") or [])}

          # Expected plugins come from the versioned inventory, NOT the registry.
          expected_plugins = [d for d in dirs if d not in unpublished]

          # External pinned images — read from entrypoint.sh (single source of
          # truth) and REQUIRE a @sha256 digest so a future switch back to a
          # floating tag is caught here instead of silently scanning a moving ref.
          ep = pathlib.Path("plugins/buildx/entrypoint.sh").read_text()
          def pin(var):
              m = re.search(rf'^{var}="([^"]+)"', ep, re.M)
              if not m:
                  sys.exit(f"::error::could not find {var} in buildx/entrypoint.sh")
              ref = m.group(1)
              if not re.search(r'@sha256:[0-9a-f]{64}$', ref):
                  sys.exit(f"::error::{var} is not digest-pinned (@sha256:...): {ref}")
              return ref
          externals = {"external-binfmt": pin("BINFMT_IMAGE"),
                       "external-buildkit": pin("DEFAULT_BUILDKIT_IMAGE")}

          include = [{"target": p, "ref": f"{reg}/gocdnext-plugin-{p}:v1"} for p in expected_plugins]
          include += [{"target": t, "ref": r} for t, r in externals.items()]
          targets = expected_plugins + list(externals)

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as fh:
              fh.write(f"matrix={json.dumps({'include': include})}\n")
              fh.write(f"expect={','.join(targets)}\n")
          print(f"expecting {len(targets)} targets ({len(expected_plugins)} plugins + {len(externals)} external)")
          PY

  db:
    # Download the Trivy DBs ONCE and share as an artifact so all scans use the
    # SAME snapshot (consistency) and we don't hit the DB registry 70 times.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: download trivy DBs
        run: |
          set -euo pipefail
          mkdir -p trivy-cache
          docker run --rm -v "$PWD/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:${{ env.TRIVY_VERSION }} image --download-db-only
          docker run --rm -v "$PWD/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:${{ env.TRIVY_VERSION }} image --download-java-db-only
          # Tarball so the cache round-trips through the artifact store with a
          # deterministic layout (no upload/download path nesting surprises).
          tar czf trivy-db.tgz -C trivy-cache .
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-db
          path: trivy-db.tgz
          retention-days: 1

  scan:
    needs: [discover, db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: trivy-db
          path: dbart
      - name: Trivy scan ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out trivy-cache
          tar xzf dbart/trivy-db.tgz -C trivy-cache
          # Resolve a plugin :v1 to an immutable digest (audit trail + the scan
          # matches exactly what ships). Any failure here fails the job -> the
          # gate sees a missing expected target and fails (fail-closed).
          ref="${{ matrix.ref }}"
          if [[ "$ref" == *:v1 ]]; then
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            ref="${ref%:v1}@${digest}"
          fi
          echo "scanning ${{ matrix.target }} -> ${ref}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-cache:/root/.cache/trivy" -v "$PWD/out:/out" \
            aquasec/trivy:${{ env.TRIVY_VERSION }} image ${{ env.TRIVY_ARGS }} \
            -f json -o "/out/${{ matrix.target }}.json" "$ref"
          echo "$ref" > "out/${{ matrix.target }}.ref"
      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.target }}
          path: out/*
          retention-days: 14

  gate:
    needs: [discover, scan]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: dl
          merge-multiple: true
      - name: Evaluate against baseline
        run: |
          set -euo pipefail
          mode="${{ github.event.inputs.high_mode || env.HIGH_MODE }}"
          python3 plugins/scripts/trivy_gate.py \
            --baseline plugins/.trivy-baseline.yaml \
            --results-dir dl \
            --high-mode "$mode" \
            --expect-targets "${{ needs.discover.outputs.expect }}" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --report-file dl/gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-gate-report
          path: dl/gate-report.json
          retention-days: 30
