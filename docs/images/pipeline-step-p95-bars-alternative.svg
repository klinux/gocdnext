<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline step p95 bars alternative</title>
  <desc id="desc">Alternative GoCDNext pipeline proposal using proportional bars to compare p95 duration across build steps.</desc>
  <rect width="1280" height="440" rx="18" fill="#09090b"/>
  <rect x="1" y="1" width="1278" height="438" rx="17" fill="none" stroke="#27272a" stroke-width="2"/>

  <text x="30" y="43" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">gocdnext</text>
  <text x="136" y="43" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="15">card / limit-reservation</text>
  <text x="1060" y="42" fill="#a1a1aa" font-family="Menlo,monospace" font-size="12">p95 · últimos 7d · 42 runs</text>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#27272a"/>

  <circle cx="32" cy="105" r="6" fill="#2dd4bf"/>
  <text x="48" y="110" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Flow</text>
  <text x="91" y="110" fill="#a1a1aa" font-family="Menlo,monospace" font-size="12">build-pr → security → publish</text>
  <circle cx="1187" cy="105" r="5" fill="#34d399"/>
  <text x="1199" y="110" fill="#34d399" font-family="Inter,Arial,sans-serif" font-size="12">healthy</text>

  <rect x="22" y="130" width="1236" height="257" rx="14" fill="#111113" stroke="#27272a"/>
  <rect x="22" y="130" width="4" height="257" rx="2" fill="#34d399"/>
  <text x="50" y="176" fill="#fafafa" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">build-pr</text>
  <text x="50" y="203" fill="#a1a1aa" font-family="Menlo,monospace" font-size="12">#884 · PR #223 · 12m 48s · 2m ago</text>

  <g transform="translate(880 166)">
    <text x="0" y="0" fill="#a1a1aa" font-family="Menlo,monospace" font-size="10">LEAD</text>
    <text x="0" y="24" fill="#fafafa" font-family="Menlo,monospace" font-size="16" font-weight="700">18m</text>
    <text x="100" y="0" fill="#a1a1aa" font-family="Menlo,monospace" font-size="10">PROC</text>
    <text x="100" y="24" fill="#fafafa" font-family="Menlo,monospace" font-size="16" font-weight="700">13m</text>
    <text x="200" y="0" fill="#a1a1aa" font-family="Menlo,monospace" font-size="10">C/A</text>
    <text x="200" y="24" fill="#fafafa" font-family="Menlo,monospace" font-size="16" font-weight="700">96%</text>
  </g>
  <line x1="38" y1="226" x2="1242" y2="226" stroke="#27272a"/>

  <g transform="translate(50 252)">
    <g transform="translate(0 0)">
      <circle cx="10" cy="10" r="9" fill="#052e24" stroke="#34d399"/>
      <path d="M6 10l3 3 6-7" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="27" y="14" fill="#fafafa" font-family="Menlo,monospace" font-size="11" font-weight="700">CHECKOUT</text>
      <text x="236" y="14" text-anchor="end" fill="#fafafa" font-family="Menlo,monospace" font-size="12" font-weight="700">38s</text>
      <rect x="27" y="28" width="209" height="6" rx="3" fill="#27272a"/>
      <rect x="27" y="28" width="18" height="6" rx="3" fill="#2dd4bf"/>
      <text x="27" y="53" fill="#a1a1aa" font-family="Menlo,monospace" font-size="9">p95 · n=42</text>
    </g>
    <g transform="translate(286 0)">
      <circle cx="10" cy="10" r="9" fill="#052e24" stroke="#34d399"/>
      <path d="M6 10l3 3 6-7" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="27" y="14" fill="#fafafa" font-family="Menlo,monospace" font-size="11" font-weight="700">COMPILE</text>
      <text x="236" y="14" text-anchor="end" fill="#fafafa" font-family="Menlo,monospace" font-size="12" font-weight="700">3m12</text>
      <rect x="27" y="28" width="209" height="6" rx="3" fill="#27272a"/>
      <rect x="27" y="28" width="77" height="6" rx="3" fill="#2dd4bf"/>
      <text x="27" y="53" fill="#a1a1aa" font-family="Menlo,monospace" font-size="9">p95 · n=42</text>
    </g>
    <g transform="translate(572 0)">
      <circle cx="10" cy="10" r="9" fill="#052e24" stroke="#34d399"/>
      <path d="M6 10l3 3 6-7" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="27" y="14" fill="#fafafa" font-family="Menlo,monospace" font-size="11" font-weight="700">TESTS</text>
      <text x="236" y="14" text-anchor="end" fill="#fbbf24" font-family="Menlo,monospace" font-size="12" font-weight="700">8m41</text>
      <rect x="27" y="28" width="209" height="6" rx="3" fill="#27272a"/>
      <rect x="27" y="28" width="209" height="6" rx="3" fill="#fbbf24"/>
      <text x="27" y="53" fill="#fbbf24" font-family="Menlo,monospace" font-size="9">p95 · gargalo</text>
    </g>
    <g transform="translate(858 0)">
      <circle cx="10" cy="10" r="9" fill="#052e24" stroke="#34d399"/>
      <path d="M6 10l3 3 6-7" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="27" y="14" fill="#fafafa" font-family="Menlo,monospace" font-size="11" font-weight="700">IMAGE</text>
      <text x="236" y="14" text-anchor="end" fill="#fafafa" font-family="Menlo,monospace" font-size="12" font-weight="700">2m06</text>
      <rect x="27" y="28" width="209" height="6" rx="3" fill="#27272a"/>
      <rect x="27" y="28" width="50" height="6" rx="3" fill="#2dd4bf"/>
      <text x="27" y="53" fill="#a1a1aa" font-family="Menlo,monospace" font-size="9">p95 · n=39</text>
    </g>
  </g>

  <text x="32" y="419" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="13">Alternativa considerada: barras facilitam comparação, mas aumentam a altura da pipeline.</text>
</svg>
