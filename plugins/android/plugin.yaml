name: android
category: build
description: >
  Build and sign Android apps. Runs Gradle (prefers the project's
  `./gradlew`, same semantics as the `gradle` plugin) on an image
  that ships the Android SDK — command-line tools, platform-tools,
  and the latest stable platform + build-tools (API 36). When a
  keystore is supplied via `secrets:`, the built artifacts are
  signed: `.apk` with `apksigner` (zipaligned first), `.aab` with
  `jarsigner` (upload key; Play App Signing re-signs). The signing
  password never reaches the command line and the keystore is
  decoded to a private tempfile outside the workspace, removed on
  exit. A project on a different `compileSdk` adds the exact SDK
  packages it needs via `sdk-components` (installed per job; bake a
  derived image if you want to avoid re-downloading them). Testing
  on devices and deploys to Play/Firebase are out of scope (separate
  plugins).

inputs:
  command:
    required: true
    description: >
      gradle tasks + args, word-split. Examples:
      "assembleRelease", "bundleRelease",
      "testDebugUnitTest lintDebug".
  working-dir:
    required: false
    default: "."
    description: >
      Directory under the workspace to cd into before running
      gradle. Nested/monorepo Android projects set this.
  jdk:
    required: false
    default: "17"
    description: >
      JDK to run Gradle + AGP against. Accepts "11", "17", "21",
      "25"; default "17" — the Android Gradle Plugin 8.x floor and
      the most common Android toolchain. Backed by the shared
      jdk-base image. Typos fail loud at the entrypoint.
  sdk-components:
    required: false
    description: >
      Extra `sdkmanager` packages to install before the build,
      space-split. The image bakes platform-tools + the latest
      stable platform/build-tools (API 36); declare anything else
      here, e.g. "platforms;android-34 build-tools;34.0.0" for an
      older compileSdk, or "ndk;26.1.10909125" for native builds.
      Licenses are auto-accepted. These install to $ANDROID_HOME (an
      absolute path outside the workspace, so the `cache:` block does
      NOT capture them — they re-download each job). To avoid that,
      bake a derived image (`FROM` this plugin) with the extra
      components installed.
  gradle-opts:
    required: false
    description: >
      Extra JVM args exported as GRADLE_OPTS. Android builds are
      memory-hungry — "-Xmx6g" is a common setting for a release
      bundle with R8/shrinking.
  build-cache:
    required: false
    description: >
      Tri-state. Unset passes no flag (respects the project's
      `org.gradle.caching`). "true" forces `--build-cache`;
      "false" forces `--no-build-cache`. Pair with capturing
      `.gradle-home/caches/build-cache-1/` in `cache:`.
  parallel:
    required: false
    description: >
      Tri-state. Unset respects `org.gradle.parallel`. "true"
      forces `--parallel`; "false" forces `--no-parallel`.
  configuration-cache:
    required: false
    description: >
      Tri-state. Unset respects
      `org.gradle.configuration-cache`. "true"/"false" force
      `--configuration-cache` / `--no-configuration-cache`.
  console:
    required: false
    default: plain
    description: >
      Gradle console mode: auto | plain | rich | verbose. Defaults
      to `plain` (CI logs are append-only; rich/verbose leak cursor
      escapes). The gocdnext log viewer colourises by content.
  daemon:
    required: false
    default: "false"
    description: >
      "true" runs with --daemon. Rarely worthwhile — each job is a
      fresh pod, so the daemon never sees a second invocation.
  args:
    required: false
    description: >
      Generic extra gradle args appended verbatim — `--stacktrace`,
      `--info`, `-Pfoo=bar`, etc.
  keystore:
    required: false
    description: >
      Base64 of the signing keystore (JKS/PKCS12). Supply from
      `secrets:` via `${{ KEYSTORE_SECRET }}` — it reaches the
      plugin as an env var, never the command line, and is masked
      in logs. Setting this turns on plugin-managed post-build
      signing with the upload key — what Play App Signing expects
      (Google re-signs for distribution, but the uploaded AAB/APK
      must already be signed with your upload key). Leaving it unset
      disables plugin-managed signing — whatever the Gradle build
      produces is left as-is (a `signingConfig` in the build, or a
      debug-signed build, still signs it). Sign in Gradle or a later
      step before uploading a release.
  keystore-password:
    required: false
    description: >
      Keystore (store) password. Required when `keystore` is set.
      Supply from `secrets:`. Passed to apksigner/jarsigner by env
      reference, never on argv.
  key-alias:
    required: false
    description: >
      Alias of the signing key inside the keystore. Required when
      `keystore` is set.
  key-password:
    required: false
    description: >
      Password of the key entry. Defaults to the keystore password
      (single-password keystores). Supply from `secrets:`.
  sign-paths:
    required: false
    description: >
      Space-split globs of artifacts to sign. Default auto-detects
      `**/build/outputs/**/*.apk` and `**/build/outputs/**/*.aab`.
      Set this when your outputs live elsewhere or you want to sign
      a specific variant only.
  zipalign:
    required: false
    default: "true"
    description: >
      Whether to zipalign APKs before signing (best practice;
      no-op for AABs). "false" skips it.

examples:
  - name: unit tests + lint
    description: >
      Run unit tests and lint via the project's wrapper. No
      signing — minimal safe shape for a PR check.
    yaml: |
      uses: ghcr.io/klinux/gocdnext-plugin-android@v1
      with:
        command: testDebugUnitTest lintDebug

  - name: signed release bundle (AAB) for Google Play
    description: >
      Build an app bundle and sign it with the upload key from
      secrets. The keystore base64 + passwords never hit the log
      or the command line. Capture the AAB + the R8 mapping as
      artifacts for later deployment / crash de-obfuscation.
    yaml: |
      secrets: [ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD]
      uses: ghcr.io/klinux/gocdnext-plugin-android@v1
      cache:
        - key: android-{{ hash "**/*.gradle*" }}-{{ hash "gradle/wrapper/gradle-wrapper.properties" }}
          paths: [.gradle-home/caches, .gradle-home/wrapper]
      with:
        command: bundleRelease
        gradle-opts: "-Xmx6g"
        build-cache: "true"
        keystore: ${{ ANDROID_KEYSTORE }}
        keystore-password: ${{ ANDROID_KEYSTORE_PASSWORD }}
        key-alias: upload
        key-password: ${{ ANDROID_KEY_PASSWORD }}
      artifacts:
        paths:
          - "app/build/outputs/bundle/release/*.aab"
          - "app/build/outputs/mapping/release/mapping.txt"

  - name: signed APK
    description: >
      Assemble + sign a release APK (zipaligned then apksigner).
      Collect the signed APK for distribution.
    yaml: |
      secrets: [ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD]
      uses: ghcr.io/klinux/gocdnext-plugin-android@v1
      with:
        command: assembleRelease
        keystore: ${{ ANDROID_KEYSTORE }}
        keystore-password: ${{ ANDROID_KEYSTORE_PASSWORD }}
        key-alias: upload
      artifacts:
        paths:
          - "app/build/outputs/apk/release/*.apk"

  - name: older compileSdk + NDK via sdk-components
    description: >
      A project on API 34 with a native module. Extra SDK packages
      install at runtime (per job); bake a derived image with them
      if the per-job download cost matters.
    yaml: |
      uses: ghcr.io/klinux/gocdnext-plugin-android@v1
      with:
        command: assembleDebug
        sdk-components: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"
        jdk: "17"
