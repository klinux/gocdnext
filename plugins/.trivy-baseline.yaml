# gocdnext plugin-image vulnerability baseline.
#
# SPECIFIC, JUSTIFIED exceptions to the plugin Trivy gate — NOT a blanket
# `.trivyignore`. Every entry names what is excepted, why, who approved it, when
# it was approved and when it expires. The gate (plugins/scripts/trivy_gate.py,
# run by .github/workflows/trivy-plugins.yml) fails when an exception is expired,
# when a class window is exceeded, when the file is invalid, or on any CRITICAL
# not covered by a valid `emergency` exception. See plugins/SECURITY-SCANNING.md.
#
# Every entry carries `result_class` — Trivy's report Class: `lang-pkgs` for
# binary/library findings, `os-pkgs` for distro packages — which drives the
# identity:
#   lang-pkgs: (target, trivy_target, cve, package, installed, origin). trivy_target
#     (Trivy's internal target, e.g. the binary path) is REQUIRED — it pins WHICH
#     binary, so a different binary can't inherit the exception.
#   os-pkgs:   (target, cve, package, installed, origin). trivy_target is OMITTED
#     (Trivy's target there is a volatile "<image> (debian 12.12)" string); the
#     installed version already pins the CVE.
# A different installed version never inherits an exception.
#
# Class windows (expires - approved_at), HARD-enforced by the gate:
#   emergency (CRITICAL)  <= 7 days    upstream-bound (HIGH) <= 90 days
#   high-fixable (HIGH)   <= 14 days   no-fix (HIGH)         <= 90 days
#   os-no-fix (CRITICAL, OS package, NO upstream fix) <= 90 days — os-pkgs only,
#     needs an explicit `fixed_version: ""` + a `risk_accepted_by` sign-off, and
#     lapses the instant Trivy reports a fix.
# Renew by a PR that bumps approved_at + expires with a fresh assessment.

version: 1

# Plugin dirs that intentionally have NO published :v1 yet (don't expect a scan).
# The gate's `expect` set is (all plugin dirs - this list), NOT what the registry
# resolves, so an outage cannot shrink the scanned set to green. Dropping a whole
# plugin is high-impact, so each entry is SHORT-LIVED and justified:
#   - target: <plugin dir>
#     reason: <why it has no :v1 yet>
#     approved_pr: <PR number>
#     approved_at: "YYYY-MM-DD"   # not in the future
#     expires: "YYYY-MM-DD"       # <= 30 days after approved_at; gate fails once past
# Empty today — all 68 plugins publish :v1.
unpublished: []

exceptions:
  # docker family (docker, buildx, docker-push are all FROM docker:29.9.3-cli and
  # bundle the SAME docker-buildx / docker-compose CLI plugins, so the identical
  # Go-module findings appear in all three — verified). Go deps compiled into the
  # upstream binaries; not Alpine packages, so `apk upgrade` cannot reach them.
  # Approved in PR #334 (docker:24-cli -> docker:29.9.3-cli, 0 CRITICAL).
  - targets: [docker, buildx, docker-push]
    trivy_target: usr/local/libexec/docker/cli-plugins/docker-buildx
    cve: CVE-2026-17106
    package: github.com/moby/go-archive
    installed: v0.2.0
    fixed_version: "0.3.0"
    origin: gobinary
    result_class: lang-pkgs
    class: upstream-bound
    justification: >-
      moby/go-archive compiled into the bundled docker-buildx binary; clears only
      when Docker ships a CLI rebuilt against >= 0.3.0.
    mitigation: Re-scan on each CLI bump; adopt the first CLI image >= 0.3.0.
    advisory: https://avd.aquasec.com/nvd/cve-2026-17106
    upstream_issue: https://github.com/moby/go-archive
    approved_pr: 334
    owner: klinux
    approved_at: "2026-11-07"
    expires: "2027-02-05"

  - targets: [docker, buildx, docker-push]
    trivy_target: usr/local/libexec/docker/cli-plugins/docker-buildx
    cve: CVE-2026-78661
    package: golang.org/x/net
    installed: v0.59.0
    fixed_version: "0.62.0"
    origin: gobinary
    result_class: lang-pkgs
    class: upstream-bound
    justification: >-
      x/net/html DoS compiled into bundled docker-buildx; upstream CLI rebuild
      against x/net >= 0.62.0 required.
    mitigation: Re-scan on each CLI bump; adopt the first CLI with x/net >= 0.62.0.
    advisory: https://pkg.go.dev/vuln/GO-2026-6860
    upstream_issue: https://github.com/golang/go/issues?q=x%2Fnet+html+DoS
    approved_pr: 334
    owner: klinux
    approved_at: "2026-11-07"
    expires: "2027-02-05"

  - targets: [docker, buildx, docker-push]
    trivy_target: usr/local/libexec/docker/cli-plugins/docker-buildx
    cve: CVE-2026-78669
