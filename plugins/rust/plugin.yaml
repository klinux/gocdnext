name: rust
category: build
description: >
  Run cargo subcommands — build, test, clippy, fmt, publish.
  Ships with the stable 1.99.1 toolchain + rustfmt + clippy.
  Switch toolchains via `toolchain: nightly` or a pinned
  `1.83.0` when a specific version is required (e.g. to hold clippy
  lints steady across image bumps). Expose a crates.io token via
  `secrets:` as `CARGO_REGISTRY_TOKEN` — cargo reads it from the
  environment, so it never reaches the log or the process argv; do
  not put a token in `command:`.

inputs:
  command:
    required: true
    description: >
      Cargo subcommand + flags, word-split. Examples:
      "test --workspace", "clippy --all-targets -- -D warnings",
      "fmt --check", "build --release".
  working-dir:
    required: false
    default: "."
    description: >
      Directory under the workspace to cd into before cargo runs.
      Monorepos with a sub-crate set this.
  toolchain:
    required: false
    default: stable
    description: >
      Rust toolchain to use. "stable" (default), "beta",
      "nightly", or a pinned "1.83.0". Installed on demand.
  rustflags:
    required: false
    description: >
      Exported as RUSTFLAGS for the command. Useful for a global
      "-D warnings" or "-C target-cpu=native" on release builds.

examples:
  - name: test workspace
    description: Run tests across a cargo workspace.
    yaml: |
      uses: ghcr.io/klinux/gocdnext-plugin-rust@v1
      with:
        command: test --workspace

  - name: clippy as gate
    description: >
      Clippy failing the build on any warning. Classic CI shape.
    yaml: |
      uses: ghcr.io/klinux/gocdnext-plugin-rust@v1
      with:
        command: clippy --all-targets -- -D warnings

  - name: publish crate with secret token
    description: >
      `cargo publish` needs a crates.io token. Expose it via secrets
      as CARGO_REGISTRY_TOKEN — cargo reads it from the environment,
      so it never touches the log or the process argv. Do NOT pass
      `--token` in command:.
    yaml: |
      secrets:
        - CARGO_REGISTRY_TOKEN
      uses: ghcr.io/klinux/gocdnext-plugin-rust@v1
      with:
        command: publish

  - name: cached build
    description: >
      Tar + restore the crates.io registry index + crate archives +
      git DB across runs. The plugin redirects $CARGO_HOME to
      .cargo-home/ inside the workspace so the `cache:` block
      covers it. target/ is added to the same cache entry so
      incremental compilation reuses prior artifacts — shaves
      most of the cold-start cost off subsequent runs.
    yaml: |
      cache:
        - key: cargo-${CI_COMMIT_BRANCH}
          paths:
            - .cargo-home
            - target
      uses: ghcr.io/klinux/gocdnext-plugin-rust@v1
      with:
        command: test --workspace
