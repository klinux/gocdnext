name: kubectl
category: deploy
description: >
  Run any `kubectl` subcommand against a cluster — apply, rollout
  status, scale, get, delete, etc. Kubeconfig comes from the
  optional `kubeconfig` input (path under the workspace OR
  inline YAML OR base64-encoded YAML); leave it empty when the
  agent runs in-cluster and should use its service account.

inputs:
  command:
    required: true
    description: >
      kubectl subcommand + args, word-split. Examples: "apply -f k8s/",
      "rollout status deploy/api -n prod", "get pods -l app=api -o wide".
  kubeconfig:
    required: false
    description: >
      Kubeconfig source. Accepts a path relative to the workspace,
      a raw YAML blob, or a base64-encoded YAML blob — auto-detected.
      Empty = use the agent's in-cluster service account.
  namespace:
    required: false
    description: >
      Default namespace for the command (equivalent to `-n`).
      Commands that already specify `-n` override this at their own
      position in the arg list.
  continue_on_error:
    required: false
    description: >
      When "true", a non-zero kubectl exit is downgraded to a WARNING and
      the job still succeeds. Use it ONLY for diagnostic commands whose
      failure must not fail the run — the canonical case is a `logs` step
      that tails a migration Job's pod AFTER a `wait --for=condition=complete`
      already confirmed the Job finished: if the target-cluster SA lacks
      `pods/log`, `kubectl logs` returns Forbidden and would otherwise fail a
      run whose migration already succeeded (→ re-run → double-mutate). Off by
      default — never set it on apply/rollout/wait, whose failures are real.

examples:
  - name: apply manifests with service account
    description: >
      Agent runs in-cluster; no kubeconfig needed — SA RBAC
      decides what the apply touches.
    yaml: |
      uses: ghcr.io/klinux/gocdnext-plugin-kubectl@v1
      with:
        command: apply -f k8s/
        namespace: prod

  - name: rollout status from external secret
    description: >
      Prod kubeconfig stored as base64 in a secret. The plugin
      auto-detects the base64 shape and decodes it.
    yaml: |
      secrets:
        - PROD_KUBECONFIG_B64
      uses: ghcr.io/klinux/gocdnext-plugin-kubectl@v1
      with:
        kubeconfig: ${{ PROD_KUBECONFIG_B64 }}
        command: rollout status deploy/api -n prod

  - name: tail a completed migration Job's log without failing the run
    description: >
      The previous job already ran `wait --for=condition=complete` on the
      Job — this one only surfaces its output. `continue_on_error` keeps a
      `pods/log` Forbidden (or a GC'd pod) from failing a run whose
      migration already succeeded.
    yaml: |
      uses: ghcr.io/klinux/gocdnext-plugin-kubectl@v1
      with:
        command: logs job/migration-api-1.${CI_UPSTREAM_RUN_COUNTER}.${CI_COMMIT_SHORT_SHA}
        namespace: prod
        continue_on_error: "true"
