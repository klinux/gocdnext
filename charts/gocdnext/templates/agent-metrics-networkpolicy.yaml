{{- if and .Values.agent.enabled .Values.agent.metrics.enabled .Values.agent.metrics.networkPolicy.enabled }}
# Restricts ingress to the agent's unauthenticated /metrics port to the peers in
# .Values.agent.metrics.networkPolicy.from (e.g. the observability namespace).
# An empty `from` denies all ingress to the port — fail-closed, so enabling the
# policy without configuring a scraper does not silently leave the port open.
# It scopes ONLY the metrics port; the agent has no inbound app traffic (gRPC is
# outbound to the server), so no other port needs allowing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gocdnext.agent.fullname" . }}-metrics
  labels:
    {{- include "gocdnext.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels: {{- include "gocdnext.agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.agent.metrics.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: metrics
{{- end }}
