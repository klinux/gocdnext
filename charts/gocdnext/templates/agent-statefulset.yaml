{{- if .Values.agent.enabled }}
{{- /*
  Drain lifecycle guard (#178): terminationGracePeriodSeconds MUST outlast the
  whole drain (job wait + flush + cleanup-worker drain + margin), or Kubernetes
  SIGKILLs the agent mid-drain and the running jobs are lost + requeued.
  values.schema.json already pins these to integers with budget>=0, flush>=1,
  grace>=1 (so a typo like "oops" fails validation instead of silently coercing
  to 0). These template guards are the cross-field backstop — the floor is a
  RELATION between three fields that JSON Schema can't express, and they still
  fire under --skip-schema-validation. Only 0 opts out of the job wait; a
  NEGATIVE budget is rejected so it can never shrink the floor below flush+40.
*/ -}}
{{- $budget := int .Values.agent.drain.budgetSeconds }}
{{- $flush := int .Values.agent.drain.flushSeconds }}
{{- $grace := int .Values.agent.drain.gracePeriodSeconds }}
{{- /* 9223372036 = floor(maxInt64 ns / 1e9): the largest whole-second Go duration.
       Bounding budget+flush here keeps the `add` below int64 max (no wrap-to-
       negative that would sneak past the floor check) AND keeps the value a
       parseable duration for the binary (a bigger one crashloops on ParseDuration). */}}
{{- $maxDurSec := 9223372036 }}
{{- if lt $budget 0 }}
{{- fail (printf "agent.drain.budgetSeconds (%d) must be >= 0 (use exactly 0 to opt out of the job wait)" $budget) }}
{{- end }}
{{- if gt $budget $maxDurSec }}
{{- fail (printf "agent.drain.budgetSeconds (%d) exceeds the max Go duration in seconds (%d)" $budget $maxDurSec) }}
{{- end }}
{{- if le $flush 0 }}
{{- fail (printf "agent.drain.flushSeconds (%d) must be > 0" $flush) }}
{{- end }}
{{- if gt $flush $maxDurSec }}
{{- fail (printf "agent.drain.flushSeconds (%d) exceeds the max Go duration in seconds (%d)" $flush $maxDurSec) }}
{{- end }}
{{- $floor := add $budget $flush 40 }}
{{- if le $grace $floor }}
{{- fail (printf "agent.drain.gracePeriodSeconds (%d) must exceed budgetSeconds (%d) + flushSeconds (%d) + 40 = %d, or Kubernetes will SIGKILL the agent mid-drain" $grace $budget $flush $floor) }}
{{- end }}
# Headless service satisfies the StatefulSet's serviceName contract.
# We never DNS-resolve agents from outside (gRPC is outbound from
# the agent to the server), but the Service still has to exist for
# the StatefulSet to come up. clusterIP: None keeps it free of
# kube-proxy overhead.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gocdnext.agent.fullname" . }}-headless
  labels:
    {{- include "gocdnext.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  selector: {{- include "gocdnext.agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: placeholder
      port: 1
---
# StatefulSet (not Deployment): the agent registers in the server
# DB by name, and the row needs to outlive pod restarts. Pod-name
# under a Deployment regenerates on every restart (random suffix
# from the ReplicaSet hash) which would orphan the registration.
# StatefulSet gives stable names — agent-0, agent-1 — that match a
# durable row.
#
# `podManagementPolicy: Parallel` so SCALE-UP/DOWN and initial
# creation run concurrently on every replica (default OrderedReady
# does those serially — fine for databases, pointless for agents:
# no election, no leader, each replica is independent).
#
# It does NOT parallelise a ROLLOUT (image/config bump). Updates use
# the default `updateStrategy: RollingUpdate` with `maxUnavailable: 1`,
# so a bump replaces ONE pod at a time, each paying up to
# `drain.gracePeriodSeconds` while its graceful drain (#178) finishes.
# With 10 replicas at grace=400 the worst-case rollout is ~66 min —
# accepted on purpose: it preserves fleet capacity (only one agent
# down at a time) over rollout speed. Concurrent rollout would need
# `maxUnavailable > 1`, which depends on the MaxUnavailableStatefulSet
# feature gate; don't set it without confirming cluster support AND
# the capacity hit. In `helm upgrade --wait`, raise `--timeout` above
# the worst-case (default is 5m).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gocdnext.agent.fullname" . }}
  labels:
    {{- include "gocdnext.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  serviceName: {{ include "gocdnext.agent.fullname" . }}-headless
  {{- if not .Values.agent.autoscaling.enabled }}
  replicas: {{ .Values.agent.replicas }}
  {{- else }}
  # replicas omitted on purpose: KEDA's HPA owns the count (#185). Templating it
  # here would make every helm/ArgoCD sync fight the autoscaler.
  {{- end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "gocdnext.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gocdnext.agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gocdnext.agent.fullname" . }}
      # Long enough for the graceful drain (#178) to finish before SIGKILL — the
      # render-time guard above enforces grace > budget + flush + 40.
      terminationGracePeriodSeconds: {{ .Values.agent.drain.gracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "gocdnext.image" (dict "root" . "imageRef" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: GOCDNEXT_SERVER_ADDR
              value: {{ printf "%s:%d" (include "gocdnext.server.fullname" .) (int .Values.server.service.grpcPort) | quote }}
            - name: GOCDNEXT_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOCDNEXT_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-token" (include "gocdnext.agent.fullname" .)) .Values.agent.tokenSecret.existingSecret }}
                  key: token
            - name: GOCDNEXT_AGENT_TAGS
              value: {{ .Values.agent.tags | quote }}
            - name: GOCDNEXT_AGENT_CAPACITY
              value: {{ .Values.agent.capacity | quote }}
            - name: GOCDNEXT_AGENT_ENGINE
              value: {{ .Values.agent.engine | quote }}
            # Graceful drain knobs (#178), rendered as Go durations. budgetSeconds:0
            # renders "0s" (a valid opt-out); flushSeconds is guarded > 0 above.
            - name: GOCDNEXT_DRAIN_BUDGET
              value: {{ printf "%ds" (int .Values.agent.drain.budgetSeconds) | quote }}
            - name: GOCDNEXT_DRAIN_FLUSH_TIMEOUT
              value: {{ printf "%ds" (int .Values.agent.drain.flushSeconds) | quote }}
            # Always rendered as a real env var: the binary uses LookupEnv, so
            # an OMITTED var means "loopback default" and would leave a listener
            # running in the pod. An explicit "" is what disables it.
            - name: GOCDNEXT_METRICS_ADDR
              {{- if .Values.agent.metrics.enabled }}
              value: {{ printf ":%d" (int .Values.agent.metrics.port) | quote }}
              {{- else }}
              value: ""
              {{- end }}
            {{- if eq .Values.agent.engine "kubernetes" }}
            - name: GOCDNEXT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # accessMode picks the workspace strategy:
            #   ReadWriteOnce (default, v0.5+): each job pod owns
            #     an ephemeral PVC via volume.ephemeral. Agent does
            #     NOT mount a workspace PVC — prep runs inside each
            #     job pod's init container.
            #   ReadWriteMany (legacy, pre-v0.5): per-replica PVC
            #     from the StatefulSet's VCT is mounted by the
            #     agent AND all spawned job pods. Requires an RWX
            #     storage class (Filestore, NFS).
            {{- if eq .Values.agent.workspace.accessMode "ReadWriteMany" }}
            - name: GOCDNEXT_K8S_WORKSPACE_MODE
              value: "shared"
            # Per-replica workspace PVC: the StatefulSet's VCT names
            # the claim `workspace-<podname>` (e.g. workspace-agent-0).
            # The agent reads this env to mount the right claim into
            # job pods.
            #
            # Order matters: kubelet only expands $(VAR) against env
            # entries DEFINED EARLIER in the list — forward refs stay
            # literal.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKSPACE_PVC_NAME
              value: workspace-$(POD_NAME)
            - name: GOCDNEXT_K8S_WORKSPACE_PVC
              value: $(WORKSPACE_PVC_NAME)
            - name: GOCDNEXT_K8S_WORKSPACE_PATH
              value: {{ .Values.agent.workspace.mountPath | quote }}
            {{- else }}
            - name: GOCDNEXT_K8S_WORKSPACE_MODE
              value: "isolated"
            - name: GOCDNEXT_K8S_WORKSPACE_PATH
              value: {{ .Values.agent.workspace.mountPath | quote }}
            - name: GOCDNEXT_K8S_WORKSPACE_SIZE
              value: {{ .Values.agent.workspace.size | quote }}
            {{- with .Values.agent.workspace.storageClass }}
            - name: GOCDNEXT_K8S_WORKSPACE_STORAGE_CLASS
              value: {{ . | quote }}
            {{- end }}
            # Init container in each job pod re-uses the agent
            # image (the `gocdnext-agent prep` subcommand is part
            # of the same binary).
            - name: GOCDNEXT_K8S_AGENT_IMAGE
              value: {{ include "gocdnext.image" (dict "root" . "imageRef" .Values.agent.image) | quote }}
            {{- with .Values.agent.workspace.housekeeperImage }}
            - name: GOCDNEXT_K8S_HOUSEKEEPER_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.workspace.housekeeperCPULimit }}
            - name: GOCDNEXT_K8S_HOUSEKEEPER_CPU_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.workspace.housekeeperMemLimit }}
            - name: GOCDNEXT_K8S_HOUSEKEEPER_MEM_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.agent.cache }}{{ with .compression }}
            # Cache store codec (#274). Restore auto-detects; flip to
            # "zstd" only once the whole fleet can read it.
            - name: GOCDNEXT_CACHE_COMPRESSION
              value: {{ . | quote }}
            {{- end }}{{- end }}
            {{- with .Values.agent.artifacts }}{{ with .compression }}
            # Artifact store codec (#274). gzip wastes CPU on already-
            # compressed artifacts (zips, image layers); zstd stores them
            # near memcpy speed. Restore auto-detects (shared UntarGz).
            - name: GOCDNEXT_ARTIFACT_COMPRESSION
              value: {{ . | quote }}
            {{- end }}{{- end }}
            {{- with .Values.agent.artifacts }}{{ if .directUpload }}
            # Direct pod→object-store artifact PUT: the housekeeper curls the
            # tar straight to the signed URL instead of streaming it through
            # the agent exec channel (the ~20 MB/s cap on big artifacts).
            # Needs a curl-capable housekeeper image + a store that accepts
            # chunked PUT (GCS). The agent probes for curl and falls back to
            # the exec-stream path when absent, so this is safe on a rolling
            # fleet.
            - name: GOCDNEXT_ARTIFACT_DIRECT_UPLOAD
              value: "true"
            {{- end }}{{- end }}
            - name: GOCDNEXT_K8S_DEFAULT_IMAGE
              value: {{ .Values.agent.defaultJobImage | quote }}
            - name: GOCDNEXT_K8S_CLEANUP_ON_SUCCESS
              value: {{ .Values.agent.jobCleanup.onSuccess | quote }}
            - name: GOCDNEXT_K8S_CLEANUP_ON_FAILURE
              value: {{ .Values.agent.jobCleanup.onFailure | quote }}
            - name: GOCDNEXT_K8S_FORCE_IMAGE_PULL_ALWAYS
              value: {{ .Values.agent.forceImagePullAlways | default false | quote }}
            {{- with .Values.agent.workspace.rootOverride }}
            - name: GOCDNEXT_WORKSPACE_ROOT
              value: {{ . | quote }}
            {{- end }}
            # Job-pod scheduling baseline (v0.14.0+). Map / list →
            # JSON via toJson. Empty defaults render as `{}` / `[]`
            # which the agent treats as "no baseline" and skips
            # parsing entirely.
            {{- with .Values.agent.jobNodeSelector }}
            - name: GOCDNEXT_K8S_JOB_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.agent.jobTolerations }}
            - name: GOCDNEXT_K8S_JOB_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.agent.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metrics.port }}
          {{- end }}
          {{- if and (eq .Values.agent.engine "kubernetes") (eq .Values.agent.workspace.accessMode "ReadWriteMany") }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.agent.workspace.mountPath }}
          {{- end }}
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
  {{- if and (eq .Values.agent.engine "kubernetes") (eq .Values.agent.workspace.accessMode "ReadWriteMany") }}
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteMany]
        {{- with .Values.agent.workspace.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.agent.workspace.size }}
  {{- end }}
{{- end }}
