{{- if .Values.agent.serviceMonitor.enabled }}
{{- if not .Values.agent.metrics.enabled }}
{{- fail "agent.serviceMonitor.enabled requires agent.metrics.enabled=true — there is no agent /metrics endpoint or Service to scrape otherwise" }}
{{- end }}
{{- end }}
{{- if and .Values.agent.enabled .Values.agent.metrics.enabled .Values.agent.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gocdnext.agent.fullname" . }}
  labels:
    {{- include "gocdnext.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    {{- with .Values.agent.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "gocdnext.agent.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.agent.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.agent.serviceMonitor.scrapeTimeout | default "10s" }}
      scheme: http
      {{- with .Values.agent.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
